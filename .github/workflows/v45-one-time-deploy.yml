name: One-time v45 Cloudflare relay deploy

on:
  push:
    branches: [deploy/v45-one-time]
    paths:
      - '.github/workflows/v45-one-time-deploy.yml'

permissions:
  contents: read

concurrency:
  group: one-time-v45-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy/v45-one-time'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: "false"
    defaults:
      run:
        working-directory: sync-relay
    steps:
      - name: Checkout validated v45 source
        uses: actions/checkout@v4
        with:
          ref: 5d4a8e6cdcd8a28436b14059b4d9be19271faf7f
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Cloudflare build requirements
        run: npm install --no-audit --no-fund
      - name: Verify relay unit tests
        run: npm test
      - name: Dry-run Worker build
        run: npx cf deploy --dry-run
      - name: Deploy Worker using GitHub encrypted secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare GitHub Actions secrets are missing."
            exit 1
          fi
          npx cf deploy --mode production
      - name: Initialize D1 call-log schema and verify public health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          list=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base?name=daily-sim-caller-logs")
          dbid=$(printf '%s' "$list" | jq -r '.result[] | select(.name == "daily-sim-caller-logs") | .uuid' | head -n 1)
          test -n "$dbid" || { echo "D1 database was not found after deploy"; exit 1; }
          echo "Found provisioned D1 database."
          jq -n --rawfile sql ./schema.sql '{sql: $sql}' > "$RUNNER_TEMP/d1-schema-request.json"
          reply=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/d1-schema-request.json" "$base/$dbid/query")
          printf '%s' "$reply" | jq -e '.success == true and (all(.result[]; .success == true))' > /dev/null || { echo "Cloudflare D1 schema setup failed"; exit 1; }
          echo "D1 call-log schema verified."
          curl -fsS --max-time 15 https://daily-sim-caller-sync.nmaxwellhbk.workers.dev/health | jq -e '.service == "daily-sim-caller-sync" and .status == "running"' > /dev/null
          echo "Worker health endpoint verified. Authentication and Sheets credentials still need configuration."
