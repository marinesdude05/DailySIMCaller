name: Android CI

on:
  push:
    branches: [main, 'build/v1.3.19-updated-buttons-api36', 'feature/v1.3.19-managed-default-app-switches', 'feature/v1.3.19-v40-auto-restart-100-percent', 'feature/v1.3.19-v41-power-menu-diagnostics', 'feature/v1.3.19-v42-setup-first-launch-repair', 'feature/v43-random-two-github-updater', 'feature/v44-per-device-call-history', 'feature/v45-secure-call-log-sync', 'feature/v46-direct-google-sheets', 'feature/v47-local-history-no-sheets']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify local-history build contains no legacy Cloudflare sync
        run: |
          test ! -e sync-relay
          test ! -e .github/workflows/deploy-v45-relay.yml
          if grep -R -n -i -E 'cloudflare|workers[.]dev|enrollment_secret|sync-relay|relay_url|/v1/enroll' app/src/main app/build.gradle.kts; then
            echo "Legacy cloud relay reference found in Android source"
            exit 1
          fi
      - name: Test and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK for internal verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sim-caller-v47-local-history-preview-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
