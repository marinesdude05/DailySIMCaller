name: Android CI

on:
  push:
    branches: [main, 'build/v1.3.19-updated-buttons-api36', 'feature/v1.3.19-managed-default-app-switches']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK for internal verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sim-caller-v1.3.19-call-now-admin-only-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
