name: Deploy v45 call-log relay

# Manual only: never deploy a preview or pull request automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/feature/v45-secure-call-log-sync'
    env:
      CF_SEND_TELEMETRY: "false"
    defaults:
      run:
        working-directory: sync-relay
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Cloudflare CLI
        run: npm install --no-audit --no-fund
      - name: Run backend unit tests
        run: npm test
      - name: Build deployable Worker
        run: npx cf build
      - name: Validate deployment without sending API requests
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Deploy only with securely stored Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }
          npx cf deploy --prebuilt --mode production
