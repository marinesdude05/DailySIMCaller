name: Deploy v45 call-log relay

# Deployment is deliberately manual and never occurs on push or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      CF_SEND_TELEMETRY: "false"
    defaults:
      run:
        working-directory: sync-relay
    steps:
      - name: Checkout reviewed v45 development branch
        uses: actions/checkout@v4
        with:
          ref: feature/v45-secure-call-log-sync
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Cloudflare CLI
        run: npm install --no-audit --no-fund
      - name: Run relay unit tests
        run: npm test
      - name: Validate Worker without contacting Cloudflare
        run: npx cf deploy --dry-run
      - name: Deploy after Cloudflare credentials are stored in GitHub secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret"; exit 1; }
          npx cf deploy --mode production
